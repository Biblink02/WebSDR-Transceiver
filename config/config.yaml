# =============================================================================
# ===                         GLOBAL SDR SETTINGS                           ===
# =============================================================================
samp_rate: 520834
lo_freq: 739700000          # Local Oscillator
lnb_lo_freq: 9750000000
# =============================================================================
# ===                        HARDWARE INTERFACE                             ===
# =============================================================================
iio_uri: "ip:192.168.2.1"
rf_bandwidth: 250000
buffer_size: 32768

# =============================================================================
# ===                         BROWSER WATERFALL                               ===
# =============================================================================
fft_size: 4096
calibration: -72

# =============================================================================
# ===                         BROWSER DSP                                   ===
# =============================================================================
audio_rate: 48000
bandwidth: 2700

# =============================================================================
# ===                        FRONTEND VALIDATION                            ===
# =============================================================================
max_bw_limit: 15000
min_bw_limit: 90

# =============================================================================
# ===                        VISUALIZATION (UI)                             ===
# =============================================================================
range_db: 40
gain_db: -10
view_limit_min: 10489500000
view_limit_max: 10489900000
# =============================================================================
# ===                       NETWORK ARCHITECTURE                            ===
# =============================================================================
sdr_host: "sdr-server"
sdr_iq_port: 5000

# =============================================================================
# ===                        STREAM URL                               ===
# =============================================================================
ws_url: "https://websdr.fbi.h-da.de"

# Packed signed I/Q, filtered and quantized once at the source.
iq_target_rate: 500000
iq_frame_samples: 8192
iq_client_queue_size: 4
iq_send_timeout: 2
iq_stall_seconds: 3
iq_scale: 1.0
sdr_health_port: 8081
sdr_stall_seconds: 2.0
sdr_idle_seconds: 10.0
