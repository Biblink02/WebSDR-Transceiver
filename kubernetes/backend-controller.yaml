apiVersion: v1
kind: Service
metadata:
  name: backend-controller
spec:
  type: ClusterIP
  selector:
    app: backend-controller
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-controller
  template:
    metadata:
      labels:
        app: backend-controller
    spec:
      containers:
      - name: backend-controller-container
        image: websdr-transceiver/backend-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: sdr-config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: sdr-config-volume
        configMap:
          name: sdr-config
          items:
          - key: config.yaml
            path: config.yaml
