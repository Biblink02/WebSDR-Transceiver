apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: frontend
        image: websdr-transceiver/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        volumeMounts:
        - name: sdr-config-volume
          mountPath: /srv/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: frontend-config
          mountPath: /etc/caddy
          readOnly: true
        - name: caddy-data
          mountPath: /data
        readinessProbe:
          exec:
            command: [wget, -q, -O, /dev/null, 'http://127.0.0.1:8082/health']
          periodSeconds: 3
          timeoutSeconds: 2
        livenessProbe:
          exec:
            command: [wget, -q, -O, /dev/null, 'http://127.0.0.1:8082/health']
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: sdr-config-volume
        configMap:
          name: sdr-config
      - name: frontend-config
        configMap:
          name: frontend-config
      - name: caddy-data
        persistentVolumeClaim:
          claimName: caddy-data
