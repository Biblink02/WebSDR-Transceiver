kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Public Nginx Proxy Manager ports
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 81
    hostPort: 81
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
