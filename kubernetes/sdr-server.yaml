apiVersion: v1
kind: Service
metadata:
  name: sdr-server
spec:
  type: ClusterIP
  selector:
    app: sdr-server
  ports:
  - name: iq-stream
    port: 5000
    targetPort: 5000
    protocol: TCP
  - name: health
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdr-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sdr-server
  template:
    metadata:
      labels:
        app: sdr-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: hardware
                operator: In
                values:
                - sdr-true
      containers:
      - name: sdr-server-container
        image: websdr-transceiver/sdr-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: iq-stream
          containerPort: 5000
          protocol: TCP
        - name: health
          containerPort: 8081
        volumeMounts:
        - name: sdr-config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        startupProbe:
          httpGet:
            path: /startup
            port: health
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 2
      volumes:
      - name: sdr-config-volume
        configMap:
          name: sdr-config
          items:
          - key: config.yaml
            path: config.yaml
