services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: ui
    working_dir: /app
    volumes:
      - ./src/app:/app/app
      - ./src/resources:/app/resources
      - ../../config/config.yaml:/app/public/config.yaml:ro
    ports:
      - "${VITE_PORT:-3100}:${VITE_PORT:-3100}"
    environment:
      VITE_PORT: "${VITE_PORT:-3100}"
      SDR_BACKEND_URL: "${SDR_BACKEND_URL:-http://host.docker.internal:8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bun run dev
